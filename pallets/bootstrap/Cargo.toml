[package]
name = "pallet-bootstrap"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
homepage.workspace = true
publish = false

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { workspace = true }
pallet-prelude = { workspace = true }
polkadot-sdk = { workspace = true, features = ["frame-support", "frame-system", "sp-core", "sp-runtime"] }
scale-info = { workspace = true }

[dev-dependencies]
pallet-prelude = { workspace = true, features = ["test"], default-features = true }
polkadot-sdk = { workspace = true, features = ["sp-core", "sp-io", "sp-keystore"], default-features = true }

[features]
default = [ "std" ]
std = [
	"codec/std",
	"pallet-prelude/std",
	"polkadot-sdk/std",
	"scale-info/std",
]
runtime-benchmarks = [
	"pallet-prelude/runtime-benchmarks",
	"polkadot-sdk/frame-benchmarking",
	"polkadot-sdk/runtime-benchmarks",
]
try-runtime = [ "polkadot-sdk/try-runtime" ]
