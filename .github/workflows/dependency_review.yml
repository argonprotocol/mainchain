name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5.1.0

      - name: Review dependencies
        uses: actions/dependency-review-action@v4.9.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
