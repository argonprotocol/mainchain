name: Install Minio
description: |
  Add Minio to the GitHub runner

runs:
  using: "composite"
  steps:
    - name: Install Minio
      if: ${{ runner.os == 'Linux' || runner.os == 'macOS' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        version=RELEASE.2025-09-07T16-13-09Z
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64)
            asset="minio.linux-amd64.$version"
            checksum=7c5bd8512c6e966455b1d198209358b2d191c77a83ab377c4073281065fb855f
            ;;
          macOS/ARM64)
            asset="minio.darwin-arm64.$version"
            checksum=7c3b3039b76e55a1b80935848ed83998d5e8d317374f87851f46a019ff5c0aa4
            ;;
          *)
            echo "Unsupported MinIO platform: $RUNNER_OS/$RUNNER_ARCH" >&2
            exit 1
            ;;
        esac

        gh release download "$version" --repo minio/minio --pattern "$asset" --dir "$RUNNER_TEMP"
        echo "$checksum  $RUNNER_TEMP/$asset" | shasum -a 256 --check
        chmod +x "$RUNNER_TEMP/$asset"
        sudo mv "$RUNNER_TEMP/$asset" /usr/local/bin/minio

    - name: Start Minio on Linux and macOS
      shell: bash
      run: |
        mkdir -p /tmp/minio
        nohup minio server /tmp/minio &
