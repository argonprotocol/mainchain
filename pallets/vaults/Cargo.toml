[package]
name = "pallet-vaults"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
homepage.workspace = true
publish = false


[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { workspace = true }
scale-info = { workspace = true }
argon-bitcoin = { workspace = true, default-features = false }
pallet-bitcoin-utxos = { workspace = true, optional = true }
polkadot-sdk = { workspace = true, features = ["frame-support", "frame-system", "sp-runtime", "sp-core"] }
pallet-prelude = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# shared_collect_skips_blocked_vault_earnings_and_expires_only_their_backing checks both financial ledgers and currency.
pallet-treasury-positions = { workspace = true, default-features = true }
pallet-bitcoin-fissions = { workspace = true, default-features = true }
pallet-bitcoin-locks = { workspace = true, default-features = true }
polkadot-sdk = { workspace = true, features = ["sp-io", "pallet-balances"], default-features = true }
pallet-prelude = { workspace = true, features = ["test"], default-features = true }
bitcoin = { workspace = true }
k256 = { workspace = true }
bip32 = { workspace = true, features = ["secp256k1"] }

[features]
default = [ "std" ]
std = [
	"argon-bitcoin/std",
	"bip32/std",
	"codec/std",
	"k256/std",
	"pallet-bitcoin-utxos?/std",
	"pallet-prelude/std",
	"polkadot-sdk/std",
	"scale-info/std",
	"tracing/std",
]
runtime-benchmarks = [
	"pallet-bitcoin-utxos/runtime-benchmarks",
	"pallet-prelude/runtime-benchmarks",
	"polkadot-sdk/frame-benchmarking",
	"polkadot-sdk/runtime-benchmarks",
]
try-runtime = [
	"pallet-bitcoin-utxos?/try-runtime",
	"polkadot-sdk/try-runtime",
]
