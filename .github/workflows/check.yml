name: Check
on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  actions: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Free Disk Space
        uses: ./.github/templates/clear-space

      - name: Install linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libssl-dev llvm libclang-dev libudev-dev protobuf-compiler pkg-config
          echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        with:
          cache: 'false'

      - uses: ./.github/templates/rust-cache
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: check-x86_64-unknown-linux-gnu

      - name: Clippy
        run: cargo clippy --workspace
        env:
          CARGO_INCREMENTAL: 0
          SKIP_WASM_BUILD: 1
          SQLX_OFFLINE: true
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin

    name: Build
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Free Disk Space
        uses: ./.github/templates/clear-space

      - uses: ikalnytskyi/action-setup-postgres@10ab8a56cc77b4823c2bfa57b1d4dd5605ef0481 # v7
      - uses: ./.github/templates/minio

      - name: Install linux dependencies
        if: ${{startsWith(matrix.os, 'ubuntu')}}
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libssl-dev llvm libclang-dev libudev-dev protobuf-compiler pkg-config
          echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"

      - name: Install mac dependencies
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install protobuf llvm@18
          # need to use more modern llvm than what is on mac to build secp256k1 for wasm
          {
            echo "LDFLAGS=-L/opt/homebrew/opt/llvm@18/lib"
            echo "CPPFLAGS=-I/opt/homebrew/opt/llvm@18/include"
            echo "RUSTFLAGS=-C linker=/opt/homebrew/opt/llvm@18/bin/clang"
            echo "CC=/opt/homebrew/opt/llvm@18/bin/clang"
            echo "CXX=/opt/homebrew/opt/llvm@18/bin/clang++"
            echo "LIBCLANG_PATH=/opt/homebrew/opt/llvm@18/lib"
          } >> "$GITHUB_ENV"

      - uses: ./.github/templates/rust-cache
        id: rust-cache
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: check-native-ci-try-runtime-${{ matrix.target }}
          key-suffix: -${{ github.sha }}
          save: 'false'
          clean-runtime-builds: 'false'

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        with:
          cache: 'false'
          target: ${{matrix.target}}

      - uses: taiki-e/install-action@c070f87102a1c75b3183910f391c1cb887fe13c8 # v2
        with:
          tool: sqlx-cli@0.8.3,cargo-nextest@0.9.148

      - name: Migrate Notary Db
        working-directory: notary
        run: cargo sqlx database setup

      - name: Create and Set Database URL
        working-directory: localchain
        run: |
          touch ${{ runner.temp }}/temp.db
          chmod 777 ${{ runner.temp }}/temp.db
          echo "DATABASE_URL=sqlite://${{ runner.temp }}/temp.db" > .env
          cat .env

      - name: Migrate Localchain Db
        working-directory: localchain
        run: cargo sqlx database setup

      - name: Show space before build
        run: df -h

      - name: Build
        run: cargo build --features=ci --features=try-runtime --lib --bins --tests
        env:
          CARGO_INCREMENTAL: 0
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SQLX_OFFLINE: ${{ startsWith(matrix.os, 'macos') }}

      - name: Show space before tests
        run: df -h

      - name: Prepare test genesis
        run: |
          test_chain_path="$RUNNER_TEMP/argon-dev-raw.json"
          "${CARGO_TARGET_DIR:-target}/debug/argon-node" build-spec --chain=dev --raw > "$test_chain_path"
          echo "ARGON_TEST_CHAIN=$test_chain_path" >> "$GITHUB_ENV"
        env:
          CI: true

      - name: Save compiled tests
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.rust-cache.outputs.cache-paths }}
          key: ${{ steps.rust-cache.outputs.cache-key }}

      - name: Run tests
        run: cargo nextest run --profile ci --features=ci --features=try-runtime --lib --bins
        timeout-minutes: 90
        env:
          CARGO_INCREMENTAL: 0
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUST_LOG: info
          CI: true
          SQLX_OFFLINE: ${{ startsWith(matrix.os, 'macos') }}

  ethereum:
    name: Ethereum contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build Ethereum artifacts and contract types
        run: yarn workspace @argonprotocol/ethereum-contracts build

      - name: Check contract types
        run: yarn workspace @argonprotocol/ethereum-contracts exec tsc --noEmit

      - name: Test Ethereum contracts
        run: yarn exec vitest run --config vitest.config.ts --project ethereum-contracts

      - name: Build and validate mainchain client package
        run: yarn workspace @argonprotocol/mainchain build

      - name: Upload Ethereum build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ethereum-contracts
          path: |
            chains/ethereum/contracts/artifacts/
            chains/ethereum/contracts/generated.ts
          if-no-files-found: error
