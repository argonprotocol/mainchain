name: CodeQL Advanced

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '29 13 * * 3'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Kotlin and Swift are intentionally outside this repository's CodeQL scope.
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: rust
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.1.0

      - name: Install Rust analysis dependencies
        if: matrix.language == 'rust'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libssl-dev llvm libclang-dev libudev-dev protobuf-compiler pkg-config
          {
            echo "LIBCLANG_PATH=$(llvm-config --libdir)"
            echo "CARGO_INCREMENTAL=0"
            echo "SKIP_WASM_BUILD=1"
            echo "SQLX_OFFLINE=true"
            # CodeQL otherwise enables all Cargo features, including optional N-API and UniFFI bindings.
            echo "CODEQL_EXTRACTOR_RUST_OPTION_CARGO_FEATURES=default"
          } >> "$GITHUB_ENV"

      - name: Install Rust
        if: matrix.language == 'rust'
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.1
        with:
          cache: 'false'

      - name: Restore Cargo build cache
        if: matrix.language == 'rust'
        uses: $/.github/templates/rust-cache
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: check-x86_64-unknown-linux-gnu
          save: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.37.3
        env:
          CODEQL_EXTRACTOR_RUST_OPTION_CARGO_TARGET_DIR: ${{ env.CARGO_TARGET_DIR }}
        with:
          category: /language:${{ matrix.language }}
