name: "Argon CodeQL Config"

paths-ignore:
  # The runtime entrypoint crates (argon/canary lib.rs) invoke construct_runtime!
  # and impl_runtime_apis! which expand into thousands of generated types, causing
  # rust-analyzer extraction to exceed the runner memory limit. Ignore these
  # specific files only; runtime/common (call filters, config, proxy types, fee
  # control) and runtime/*/migrations.rs remain scanned as they contain
  # security-relevant dispatch constraints and upgrade logic.
  - runtime/argon/src/lib.rs
  - runtime/argon/src/benchmark.rs
  - runtime/argon/build.rs
  - runtime/argon/src/weights/**
  - runtime/canary/src/lib.rs
  - runtime/canary/src/benchmark.rs
  - runtime/canary/build.rs
  - runtime/canary/src/weights/**
  # Test helpers and fixtures are not security-critical code paths.
  - testing/**
  - end-to-end/**
