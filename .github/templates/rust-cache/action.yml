name: Cache rust dependencies
description: |
  Shared config to cache rust dependencies

inputs:
  github-token:
    description: 'The github token'
    required: true
  name:
    description: 'The name of the cache'
    required: true
  save:
    description: 'Whether to save the cache'
    required: false
    default: "true"
  key-suffix:
    description: 'Optional suffix for a fresh cache entry'
    required: false
    default: ""
  clean-runtime-builds:
    description: 'Clear runtime/WASM build artifacts restored from cache'
    required: false
    default: "true"

outputs:
  cache-key:
    description: 'Primary cache key'
    value: ${{ steps.config.outputs.key }}
  cache-paths:
    description: 'Paths included in the cache'
    value: ${{ steps.config.outputs.paths }}
  cache-hit:
    description: 'Whether the primary key was restored'
    value: ${{ steps.cache.outputs.cache-hit || steps.restore.outputs.cache-hit }}

runs:
  using: "composite"
  steps:
    - name: Print space before restore
      run: df -h
      shell: bash
    - name: Get rustc version
      id: rust-version
      run: echo "version=$(rustc --version --verbose | grep 'release:' | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      shell: bash
    - name: Get OS version string
      id: os_version
      shell: bash
      run: |
        if [ "$RUNNER_OS" == "Linux" ]; then
          # shellcheck source=/dev/null
          source /etc/os-release
          echo "version=$ID-$VERSION_ID" >> "$GITHUB_OUTPUT"
          sudo mkdir -p /mnt/target
          sudo chown -R "$USER:$USER" /mnt/target
          sudo rm -rf target
          sudo ln -s /mnt/target target
          echo "CARGO_TARGET_DIR=/mnt/target" >> "$GITHUB_ENV"
          echo "WASM_BUILD_WORKSPACE_HINT=${GITHUB_WORKSPACE}" >> "$GITHUB_ENV"
        elif [ "$RUNNER_OS" == "macOS" ]; then
          echo "version=macos-$(sw_vers -productVersion)" >> "$GITHUB_OUTPUT"
        elif [ "$RUNNER_OS" == "Windows" ]; then
          ver_str=$(cmd /c ver)
          echo "version=windows-$(echo "$ver_str" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')" >> "$GITHUB_OUTPUT"
        fi
    - name: Configure cache
      id: config
      shell: bash
      env:
        CACHE_PREFIX: ${{ inputs.name }}-${{ steps.os_version.outputs.version }}-${{ steps.rust-version.outputs.version }}-
        LOCK_HASH: ${{ hashFiles('./Cargo.lock') }}
        CACHE_SUFFIX: ${{ inputs.key-suffix }}
      run: |
        cat >> "$GITHUB_OUTPUT" <<EOF
        key=${CACHE_PREFIX}${LOCK_HASH}${CACHE_SUFFIX}
        lock-prefix=${CACHE_PREFIX}${LOCK_HASH}
        restore-prefix=${CACHE_PREFIX}
        paths<<CACHE_PATHS
        ~/.cargo/registry/index/
        ~/.cargo/registry/cache/
        ~/.cargo/git/db/
        .cargo-cache
        ${CARGO_TARGET_DIR:-target}/
        CACHE_PATHS
        EOF
    - name: Cache cargo
      id: cache
      if: inputs.save == 'true'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ steps.config.outputs.paths }}
        key: ${{ steps.config.outputs.key }}
        restore-keys: |
          ${{ steps.config.outputs.lock-prefix }}
          ${{ steps.config.outputs.restore-prefix }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
    - name: Restore cargo cache
      id: restore
      if: inputs.save != 'true'
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ steps.config.outputs.paths }}
        key: ${{ steps.config.outputs.key }}
        restore-keys: |
          ${{ steps.config.outputs.lock-prefix }}
          ${{ steps.config.outputs.restore-prefix }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
    - name: Clean runtime builds
      if: inputs.clean-runtime-builds == 'true'
      run: |
        set -euo pipefail

        # Default to the standard cargo target dir if CARGO_TARGET_DIR isn't set.
        CARGO_TARGET_DIR_PATH="${CARGO_TARGET_DIR:-target}"

        echo "Cleaning runtime/WASM build caches under: ${CARGO_TARGET_DIR_PATH}"

        # Substrate's wasm-builder commonly uses a `wbuild/` directory under target.
        # Stale wasm artifacts here can cause metadata/client incompatibility.
        rm -rf "${CARGO_TARGET_DIR_PATH}/wbuild" \
               "${CARGO_TARGET_DIR_PATH}/debug/wbuild" \
               "${CARGO_TARGET_DIR_PATH}/release/wbuild" || true

        # Clear build-script OUT_DIR outputs for the most likely metadata-sensitive crates.
        # This keeps most dependency artifacts but forces runtime/node codegen to rerun.
        rm -rf "${CARGO_TARGET_DIR_PATH}/debug/build"/*argon-* || true
        rm -rf "${CARGO_TARGET_DIR_PATH}/debug/build"/*argon_* || true

        echo "After cleanup, top-level sizes:"
        du -sh "${CARGO_TARGET_DIR_PATH}" 2>/dev/null || true
      shell: bash
    - name: Print space after restore
      run: |
        echo "Disk space after restore:"
        df -h
        echo "Cargo cache size:"
        du -sh ~/.cargo/registry/index/ 2>/dev/null || true
        du -sh ~/.cargo/registry/cache/ 2>/dev/null || true
        du -sh ~/.cargo/git/db/ 2>/dev/null || true
        du -sh .cargo-cache 2>/dev/null || true
        du -sh target/ 2>/dev/null || true
      shell: bash
